<div class="login-box">
  <h2>用户登录</h2>

  <div class="input-item">
    <input [(ngModel)]="username" placeholder="用户名">
  </div>
  <div class="input-item">
    <input [(ngModel)]="password" type="password" placeholder="密码">
  </div>

  <div class="input-item code-box">
    <input [(ngModel)]="code" placeholder="验证码">
    <img #codeImg (click)="getCode()">
  </div>

  <button (click)="login()">登录</button>
  <div class="to-register">
    没有账号？<a routerLink="/register">立即注册</a>
  </div>
</div>
