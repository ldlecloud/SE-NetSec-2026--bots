<!-- 顶部导航栏 -->
<div class="top-bar">
  <h3>AI提示注入挑战</h3>

  <div class="user-info">
    <img src="https://picsum.photos/32" alt="头像">
    <span>{{ username }}</span>
    <div class="dropdown" (click)="logout()">退出登录</div>
  </div>
</div>

<div class="container">
  <div class="chat-area">
    <div class="challenge-tabs">
      <button 
        class="challenge-tab" 
        [class.active]="currentChallengeType === challenges[0].type"
        (click)="switchChallenge(challenges[0].type, challenges[0].desc)"
      >提示忽略注入（基础）</button>

      <button 
        class="challenge-tab" 
        [class.active]="currentChallengeType === challenges[1].type"
        (click)="switchChallenge(challenges[1].type, challenges[1].desc)"
      >角色伪装注入（中级）</button>

      <button 
        class="challenge-tab" 
        [class.active]="currentChallengeType === challenges[2].type"
        (click)="switchChallenge(challenges[2].type, challenges[2].desc)"
      >间接注入（高阶）</button>
    </div>

    <div class="chat-box" #chatBox>
      <div class="message ai-msg">AI助手：你好！欢迎来到juice shop，我是你的个人智能助手。</div>
    </div>

    <div class="input-area">
      <input type="text" [(ngModel)]="userInput" placeholder="输入消息..." (keydown.enter)="sendMsg()">
      <button (click)="sendMsg()">发送</button>
    </div>
  </div>

  <div class="hint-area">
    <h3>挑战说明</h3>
    <p>{{ challengeDesc }}</p>
    <hr style="margin:20px 0">
    <h4>当前积分：<span>{{ score }}</span></h4>
  </div>
</div>

<div class="overlay" id="overlay" [style.display]="overlayDisplay"></div>
<div class="modal" id="modal" [style.display]="modalDisplay">
  <h3>{{ modalTitle }}</h3>
  <p>{{ modalMsg }}</p>
  <button (click)="closeModal()">确定</button>
</div>
